name: Governance Operations Verification

on:
  push:
    branches: [main]
    paths:
      - "22-governance-operations/**"
      - ".github/workflows/governance-operations.yml"
  pull_request:
    paths:
      - "22-governance-operations/**"
      - ".github/workflows/governance-operations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [engine, analyzer, cli]

    defaults:
      run:
        working-directory: 22-governance-operations/${{ matrix.package }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install package dependencies
        run: npm install

      - name: Report dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          try {
            const report = require("./npm-audit.json");
            console.log("Dependency vulnerability totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const advisories = (item.via ?? []).map((entry) =>
                typeof entry === "string" ? entry : `${entry.title} (${entry.url ?? "no advisory URL"})`
              );
              console.log(`${item.severity}: ${name} | affected=${item.range} | fixAvailable=${JSON.stringify(item.fixAvailable)} | ${advisories.join("; ")}`);
            }
          } catch {
            console.log("Dependency audit report could not be parsed; inspect npm audit output.");
          }
          NODE

      - name: Type-check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
